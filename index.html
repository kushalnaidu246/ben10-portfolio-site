<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEN 10 — Omnitrix Experience</title>
  <meta name="description" content="Cinematic interactive Ben 10 scroll-driven storytelling experience. Activate the Omnitrix and unlock all 10 alien DNA sequences.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>

  <!-- Preload hero artwork so the opening frame paints immediately -->
  <link rel="preload" as="image" href="assets/intro/frame_01.jpg">
</head>
<body>

  <!-- Shared vector Omnitrix faceplate (classic Original Series dial), reused by the hero and dial modal -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="omni-bezel" cx="50%" cy="35%" r="65%">
        <stop offset="0" stop-color="#b4bbc2"/>
        <stop offset="0.6" stop-color="#6d747b"/>
        <stop offset="1" stop-color="#33383d"/>
      </radialGradient>
      <radialGradient id="omni-glass" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="#16241a"/>
        <stop offset="1" stop-color="#030504"/>
      </radialGradient>
      <linearGradient id="omni-green" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c4ff6a"/>
        <stop offset="0.5" stop-color="#5dff2e"/>
        <stop offset="1" stop-color="#19c23a"/>
      </linearGradient>
      <clipPath id="omni-face-clip"><circle cx="100" cy="100" r="60"/></clipPath>
      <filter id="omni-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <symbol id="omni-face" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="99" fill="#141618"/>
        <circle cx="100" cy="100" r="93" fill="url(#omni-bezel)" stroke="#0e1011" stroke-width="3"/>
        <g fill="#2a2e32" stroke="#0e1011" stroke-width="2">
          <rect x="92" y="5" width="16" height="18" rx="4"/>
          <rect x="92" y="177" width="16" height="18" rx="4"/>
          <rect x="5" y="92" width="18" height="16" rx="4"/>
          <rect x="177" y="92" width="18" height="16" rx="4"/>
        </g>
        <circle cx="100" cy="100" r="74" fill="#2b2f33" stroke="#0e1011" stroke-width="3"/>
        <circle cx="100" cy="100" r="64" fill="#0c0f0d" stroke="#5dff2e" stroke-opacity="0.45" stroke-width="2"/>
        <g clip-path="url(#omni-face-clip)">
          <circle cx="100" cy="100" r="60" fill="url(#omni-glass)"/>
          <path d="M26 30 H174 L109 100 L174 170 H26 L91 100 Z" fill="url(#omni-green)" filter="url(#omni-glow)"/>
          <ellipse cx="82" cy="70" rx="38" ry="18" fill="#ffffff" opacity="0.08" transform="rotate(-25 82 70)"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- Background Particle & Energy VFX Canvas -->
  <canvas id="vfx-canvas" class="fixed-canvas" aria-hidden="true"></canvas>

  <!-- Ambient Fog & Vignette Overlays -->
  <div class="cinematic-vignette" aria-hidden="true"></div>
  <div class="scanline-overlay" aria-hidden="true"></div>

  <!-- Screen Flash for Omnitrix Transformation -->
  <div id="transformation-flash" class="transformation-flash" aria-hidden="true"></div>


  <!-- ========================================== -->
  <!-- OMNITRIX DIAL (fixed): grows out of Ben's watch in the hero, opens into
       selection mode, then docks on the left of the alien showcase -->
  <!-- ========================================== -->
  <div class="omnitrix-macro-layer" id="omnitrix-macro-layer" aria-hidden="true">
    <div class="omnitrix-device-container" id="omnitrix-device-container">
      <!-- Holographic Emitter Rings -->
      <div class="hologram-emitter" id="hologram-emitter">
        <div class="holo-ring holo-ring-1"></div>
        <div class="holo-ring holo-ring-2"></div>
        <div class="holo-ring holo-ring-3"></div>
      </div>

      <div class="omnitrix-chassis" id="omnitrix-chassis">
        <!-- Live faceplate (viewBox centred on 0,0). The green pattern is redrawn from one
             value as the Omnitrix opens: hourglass -> cross -> growing square -> full diamond. -->
        <svg class="omni-face-live" id="omni-face-live" viewBox="-100 -100 200 200" aria-hidden="true">
          <defs>
            <clipPath id="omni-live-clip"><circle r="58"/></clipPath>
            <filter id="omni-live-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="7"/>
            </filter>
            <radialGradient id="omni-housing" cx="40%" cy="35%" r="75%">
              <stop offset="0" stop-color="#2c2d2f"/>
              <stop offset="1" stop-color="#121213"/>
            </radialGradient>
            <radialGradient id="omni-light" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#e8ffd0"/>
              <stop offset="0.35" stop-color="#8fd41e"/>
              <stop offset="1" stop-color="#3f7a0a"/>
            </radialGradient>
          </defs>

          <!-- Watch housing (static): chunky black body with grey prongs and the big button -->
          <circle r="99" fill="url(#omni-housing)" stroke="#000" stroke-width="2"/>
          <g fill="#8d9094" stroke="#000" stroke-width="2">
            <rect x="-12" y="-101" width="24" height="17" rx="5"/>
            <rect x="-12" y="-101" width="24" height="17" rx="5" transform="rotate(90)"/>
            <rect x="-12" y="-101" width="24" height="17" rx="5" transform="rotate(180)"/>
            <rect x="-12" y="-101" width="24" height="17" rx="5" transform="rotate(270)"/>
          </g>
          <path d="M 62 -62 A 88 88 0 0 1 62 62" fill="none" stroke="#3a3b3e" stroke-width="5" opacity="0.6"/>
          <g transform="rotate(-45) translate(0 82)">
            <circle r="15" fill="#2a2b2d" stroke="#000" stroke-width="2"/>
            <circle r="12" fill="#9a9da1" stroke="#000" stroke-width="1.5"/>
            <circle r="9" fill="url(#omni-light)" stroke="#000" stroke-width="1.5"/>
            <ellipse cx="-2.5" cy="-3" rx="3.5" ry="2.2" fill="#f2ffe6" opacity="0.85"/>
          </g>

          <!-- Dial ring: turns one click per alien (bumps + lights ride on it) -->
          <g id="select-ring">
            <circle r="78" fill="#050505" stroke="#000" stroke-width="2"/>
            <g fill="#3a3b3e" stroke="#000" stroke-width="1.5">
              <ellipse cx="0" cy="-70" rx="8" ry="5.5" transform="rotate(-38)"/>
              <ellipse cx="0" cy="-70" rx="8" ry="5.5" transform="rotate(38)"/>
            </g>
            <g transform="rotate(-140) translate(0 -70)">
              <circle r="7.5" fill="#1d1e20" stroke="#000" stroke-width="1.5"/>
              <circle r="5" fill="url(#omni-light)" stroke="#000" stroke-width="1"/>
            </g>
            <g transform="rotate(140) translate(0 -70)">
              <circle r="7.5" fill="#1d1e20" stroke="#000" stroke-width="1.5"/>
              <circle r="5" fill="url(#omni-light)" stroke="#000" stroke-width="1"/>
            </g>
          </g>

          <!-- Silver rim around the face -->
          <circle r="61.5" fill="none" stroke="#a9abae" stroke-width="5"/>
          <circle r="64" fill="none" stroke="#000" stroke-width="1"/>

          <!-- Live face. The pattern keeps its original units (face radius 88) and is scaled to
               the face radius 58 here. -->
          <g clip-path="url(#omni-live-clip)">
            <circle r="58" fill="#5d5f61"/>
            <g transform="scale(0.659) rotate(45)">
              <!-- Strokes drawn first and fills on top, so only the outline of the union shows -->
              <g fill="none" stroke="#0b0b0b" stroke-width="14" stroke-linejoin="miter">
                <polygon class="omni-p-a"/><polygon class="omni-p-b"/><polygon class="omni-p-sq"/>
              </g>
              <g fill="#8fd41e">
                <polygon class="omni-p-a"/><polygon class="omni-p-b"/><polygon class="omni-p-sq"/>
              </g>
              <!-- Activation glow on the open diamond -->
              <polygon class="omni-p-sq" id="omni-live-glow-shape" fill="#c6ff5a" filter="url(#omni-live-glow)" opacity="0"/>
            </g>
            <ellipse cx="-15" cy="-26" rx="32" ry="13" fill="#ffffff" opacity="0.07" transform="rotate(-25)"/>
          </g>
        </svg>

        <!-- Alien DNA silhouette, shown once the face has opened into the diamond -->
        <div class="select-silhouette-wrap" id="select-silhouette-wrap">
          <div class="select-silhouette" id="select-silhouette"></div>
        </div>

        <!-- Mechanical ring overlay -->
        <div class="dial-rotator-overlay" id="dial-rotator-overlay">
          <div class="dial-pip pip-top"></div>
          <div class="dial-pip pip-bottom"></div>
          <div class="dial-pip pip-left"></div>
          <div class="dial-pip pip-right"></div>
          <div class="omni-laser-sight"></div>
        </div>

        <!-- Glowing core -->
        <div class="omni-glow-core" id="omni-glow-core"></div>
      </div>

      <!-- Mechanical Pop-Up Activation Pistons -->
      <div class="omni-piston piston-left" id="piston-left"></div>
      <div class="omni-piston piston-right" id="piston-right"></div>
    </div>
  </div>

  <!-- MAIN SCROLL STORY CONTAINER -->
  <main id="story-root">

    <!-- ========================================== -->
    <!-- ACT 1 & ACT 2: OPENING SCENE & OMNITRIX ACTIVATION -->
    <!-- ========================================== -->
    <section id="hero-story-pin" class="story-pin-section" aria-label="Ben Tennyson and Omnitrix Activation">
      <div class="hero-viewport" id="hero-viewport">

        <!-- Static backdrop behind Ben -->
        <div class="hero-backdrop" aria-hidden="true"></div>

        <!-- Layer 1: Ben Tennyson Extended Arm & Hero Artwork -->
        <!-- Intro: Ben, then a flash cut to the Omnitrix (the fixed watch layer below) -->
        <!-- Burst of Omnitrix light that hides the cut between different shots -->
        <div class="intro-flash" id="intro-flash" aria-hidden="true"></div>

        <div class="intro-panel" id="intro-panel">
          <img src="assets/intro/frame_01.jpg" class="intro-frame" alt="Ben Tennyson with the Omnitrix on his wrist" decoding="async" fetchpriority="high">
        </div>

        <!-- Initial Opening Screen Minimal Overlay (Fades out on scroll) -->
        <div class="opening-hero-text" id="opening-hero-text">
          <div class="alien-quote-tag">HERO TIME PROTOCOL INITIATED</div>
          <h1 class="hero-cinematic-title">
            <span class="title-sub">THE WEAPON OF LEVEL 20</span>
            <span class="title-main">OMNITRIX</span>
          </h1>
          <p class="hero-cinematic-desc">
            Created by Azmuth of Galvan Prime. Housing the genetic blueprints of 1,000,000+ extraterrestrial species.
          </p>
        </div>

        <!-- Scroll Indicator (Bottom) -->
        <div class="scroll-cue" id="scroll-cue">
          <div class="scroll-energy-line"></div>
          <span class="scroll-label">SCROLL TO ACTIVATE</span>
          <div class="scroll-chevrons">
            <div class="chevron"></div>
            <div class="chevron"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- ========================================== -->
    <!-- ACT 3 & ACT 4: ALIEN SHOWCASE SECTIONS -->
    <!-- ========================================== -->
    <section id="aliens-viewport-section" class="aliens-viewport-section" aria-label="Alien DNA Database">
      
      <!-- Persistent Alien Quick Navigation Bar (Sticky HUD) -->
      <nav class="alien-sticky-nav" id="alien-sticky-nav" aria-label="Alien Navigation">
        <div class="nav-track">
          <button class="nav-arrow-btn prev-btn" id="prev-alien-btn" aria-label="Previous Alien">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>

          <div class="alien-nodes-carousel" id="alien-nodes-carousel">
            <!-- Injected dynamically via JS: 10 glowing Omnitrix nodes -->
          </div>

          <button class="nav-arrow-btn next-btn" id="next-alien-btn" aria-label="Next Alien">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <div class="nav-right-cluster">
          <button class="nav-dial-btn" id="dial-modal-toggle" aria-label="Open Omnitrix Dial Selector">
            <span class="mini-omni-core"></span>
            <span>DIAL WHEEL</span>
          </button>
          <div class="alien-counter-badge" id="alien-counter-badge">
            <span class="current-num" id="current-alien-num">01</span>
            <span class="divider">/</span>
            <span class="total-num">10</span>
          </div>
        </div>
      </nav>

      <!-- Alien Showcase Pages Container -->
      <div id="aliens-list" class="aliens-list">
        <!-- Rendered dynamically by aliensData.js -->
      </div>

    </section>

  </main>

  <!-- ========================================== -->
  <!-- MODAL: INTERACTIVE OMNITRIX DIAL SELECTOR -->
  <!-- ========================================== -->
  <div class="dial-modal" id="dial-modal" aria-hidden="true">
    <div class="dial-modal-backdrop" id="dial-modal-backdrop"></div>
    <div class="dial-modal-content">
      <div class="dial-modal-header">
        <div class="modal-title-group">
          <span class="modal-tag">GALVANIC INTERFACE</span>
          <h2 class="modal-title">OMNITRIX DNA DIAL</h2>
        </div>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Close Dial Selector">✕</button>
      </div>

      <div class="dial-rotary-wheel-container">
        <!-- Central Omnitrix Clickable Dial -->
        <div class="wheel-core" id="wheel-core">
          <svg class="wheel-core-img" id="wheel-core-img" viewBox="0 0 200 200" role="img" aria-label="Omnitrix dial"><use href="#omni-face"/></svg>
          <div class="wheel-hour-glow"></div>
        </div>
        
        <!-- 10 Alien Slots orbiting in a circle -->
        <div class="orbiting-alien-slots" id="orbiting-alien-slots">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="dial-modal-footer">
        <span class="tip-text">CLICK ANY ALIEN DNA GLYPH OR SPIN THE WHEEL TO QUICK TRANSFORM</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="main.js"></script>
</body>
</html>
